<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMARIO</title>
    <link rel="stylesheet" href="_css/style.css">

    <!-- Favicon -->
    <link rel="shortcut icon" href="_imagens/senai.png" type="image/x-icon">

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <audio autoplay loop id="troca" src="_media/sounds/mario.mp3" type="audio/mp3"></audio>
    <div class="game-board">
        <!-- Tela de Início Premium (Glassmorphism) -->
        <div class="tela_inicio">
            <div class="logo-container">
                <img src="_imagens/senai.png" class="logo_senai" alt="Logo SENAI">
            </div>
            
            <h1 class="game-title">MUNDO DOS DESAFIOS</h1>
            
            <!-- Cards de Seleção de Personagem -->
            <div class="character-selection-container">
                <p class="select-subtitle">Escolha seu Herói:</p>
                <div class="character-grid">
                    <div class="char-card selected" data-char="mario" onclick="selecionarPersonagem('mario')">
                        <div class="char-gif-wrapper">
                            <img src="_media/gifs-startscreen/marioDancando.gif" class="char-card-gif" alt="Mario">
                        </div>
                        <span class="char-name">MARIO</span>
                    </div>
                    <div class="char-card" data-char="luigi" onclick="selecionarPersonagem('luigi')">
                        <div class="char-gif-wrapper">
                            <img src="_media/gifs-startscreen/luigi_dance.gif" class="char-card-gif" alt="Luigi">
                        </div>
                        <span class="char-name">LUIGI</span>
                    </div>
                    <div class="char-card" data-char="sonic" onclick="selecionarPersonagem('sonic')">
                        <div class="char-gif-wrapper">
                            <img src="_media/gifs-startscreen/sonic_dance.gif" class="char-card-gif" alt="Sonic">
                        </div>
                        <span class="char-name">SONIC</span>
                    </div>
                    <div class="char-card" data-char="pikachu" onclick="selecionarPersonagem('pikachu')">
                        <div class="char-gif-wrapper">
                            <img src="_media/gifs-startscreen/pikachu_parado.gif" class="char-card-gif" alt="Pikachu">
                        </div>
                        <span class="char-name">PIKACHU</span>
                    </div>
                    <div class="char-card" data-char="yoshi" onclick="selecionarPersonagem('yoshi')">
                        <div class="char-gif-wrapper">
                            <img src="_media/gifs-startscreen/yoshi_dance.gif" class="char-card-gif" alt="Yoshi">
                        </div>
                        <span class="char-name">YOSHI</span>
                    </div>
                </div>
            </div>

            <button onclick="iniciarGame()" class="start-button">START GAME</button>
        </div>

        <!-- Tela de Morte / Continuar Reestruturada -->
        <div class="div-continuar" id="tela-morte">
            <div class="death-panel">
                <h2 id="death-title">Continuar?</h2>
                <div class="death-options">
                    <button onclick="tiraVida()" class="btn-yes">Sim</button>
                    <button onclick="reiniciarJogoTotal()" class="btn-no">Não</button>
                </div>
            </div>
        </div>

        <!-- Painel de Informações Premium -->
        <div class="info-board">
            <div class="score-row">
                <div class="score-box">
                    <span class="score-label">PONTOS</span>
                    <span id="pontos">0</span>
                </div>
                <div class="score-box record-box">
                    <span class="score-label">RECORDE</span>
                    <span id="recorde-pontos">0</span>
                </div>
            </div>
            <div class="lifes-and-sound">
                <div class="lifes">
                    <img src="_media/corazon-pixel.gif" class="heart" alt="Coração 1">
                    <img src="_media/corazon-pixel.gif" class="heart1" alt="Coração 2">
                    <img src="_media/corazon-pixel.gif" class="heart2" alt="Coração 3">
                </div>
                <button id="btn-sound" onclick="toggleMute()" class="sound-button" title="Mudar som">
                    <span id="sound-icon">🔊</span>
                </button>
            </div>
        </div>

        <!-- Elementos do Cenário -->
        <img src="_imagens/clouds.png" class="clouds" alt="Nuvens">
        <img src="_media/pretin.gif" class="pretin" id="pretin" alt="Pretin">
        <img src="_media/luta_epica.gif" class="goku_golpes" alt="Efeito Goku">
        <img src="_media/dragonair.gif" class="dragonair" alt="Dragonair">
        <img src="_media/dragon.gif" class="dragon" alt="Dragon">
        <img src="_media/goku.gif" class="goku" alt="Goku">
        
        <!-- O Personagem (Player) -->
        <img src="_media/gifs-principais/mario.gif" class="mario" id="player" alt="Personagem Jogador">
        
        <!-- Obstáculos e Moedas -->
        <img src="_imagens/pipe.png" class="pipe" alt="Cano">
        <img src="_imagens/coin.png" class="coin" alt="Moeda">
        
        <!-- Estrelas no Céu -->
        <div class="sky-stars">
            <img src="_imagens/stars2.png" class="stars" alt="Estrela">
            <img src="_imagens/stars2.png" class="stars" alt="Estrela">
            <img src="_imagens/stars2.png" class="stars" alt="Estrela">
        </div>
    </div>
</body>
<script src="_javascript/script.js" defer></script>
</html>
